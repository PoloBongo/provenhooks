name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: catch a Claude Code release that breaks a hook
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # Git Bash on Windows, where most users run these hooks
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning lib/*.sh lib/fixtures/*.sh hooks/*/*.sh
      - name: diagnostics (temporaire)
        run: |
          bash --version | head -1; git --version
          echo "TMPDIR=[$TMPDIR]  autocrlf=$(git config --get core.autocrlf || echo unset)"
          set -x
          . lib/harness.sh
          ph_repo
          printf 'check **/*.ts npm run types\n' > .claude/stop-gate.conf
          echo 'export const a = 1' > a.ts
          bash -x "$OLDPWD/hooks/stop-gate/stop-gate.sh" <<< '{"stop_hook_active":false}' 2>&1 | tail -40 || echo "RC=$?"

      - name: harness and contract
        run: bash lib/test.sh
      - name: run every hook's test suite
        run: |
          status=0
          for t in hooks/*/test.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
